<!doctype html>
<!--
  학생 채점 화면 — 종이로 풀고, 답만 폰으로 넣습니다.

  ★ 정답은 이 화면으로 **안 내려옵니다.** 서버가 채점해서 틀린 번호만 알려주고,
    정답·해설은 **다시 풀기까지 끝난 뒤에야** 옵니다.
    여기에 정답을 미리 받아두면 개발자 도구에서 그냥 보입니다 — 절대 하지 마세요.

  ★ 순서: 풀기 → 제출(틀린 번호만) → 틀린 것만 다시 → 정답·해설 → 서술형 자기채점 → 점수
  ★ 폰에서 **엄지로** 누릅니다. 버튼을 작게 만들지 마세요.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시험지 채점</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root{ --green:#1f7a70; --ink:#1b2a27; --muted:#677872; --line:#dfe6e3; --bg:#f6f8f7; --card:#fff;
         --bad:#c0392b; --badbg:#fdf0ee; --okbg:#eef7f2; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.7;font-size:16px;word-break:keep-all;
       font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
       -webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 90px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:12px}
  h1{font-size:20px;font-weight:900;margin:0 0 4px}
  h2{font-size:17px;font-weight:900;margin:0 0 4px}
  .lead{color:var(--muted);font-size:14px;margin:0 0 14px}
  label{display:block;font-size:14px;font-weight:800;margin:12px 0 6px}
  input,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--ink);background:#fff;
    border:1.5px solid var(--line);border-radius:10px;padding:12px}
  input:focus,textarea:focus{outline:none;border-color:var(--green)}
  .btn{width:100%;font-family:inherit;font-size:16px;font-weight:800;cursor:pointer;border:none;
       border-radius:12px;background:var(--green);color:#fff;padding:15px}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  .btn.sm{font-size:14px;padding:11px}
  .msg{border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px}
  .msg.bad{background:var(--badbg);border:1px solid #f0c9bd;color:#7a2d18}
  .msg.ok{background:var(--okbg);border:1px solid #cfe6da}

  /* 문항 — 엄지로 누르는 크기 */
  .q{border-bottom:1px solid var(--line);padding:14px 0}
  .q:last-child{border-bottom:none}
  .q .no{font-family:'Space Mono',monospace;font-weight:700;font-size:15px;color:var(--muted);margin-bottom:8px;
         display:flex;align-items:center;gap:8px}
  .q .no b{color:var(--ink);font-size:17px}
  .pick{display:flex;gap:8px}
  .pick button{flex:1;aspect-ratio:1/1;max-height:62px;font-family:inherit;font-size:20px;font-weight:800;
    border:2px solid var(--line);background:#fff;color:var(--muted);border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .pick button.on{border-color:var(--green);background:var(--green);color:#fff}
  .q.again .pick button.on{border-color:#b8860b;background:#b8860b}
  .tag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:999px;background:#eef2f1;color:var(--muted)}
  .tag.bad{background:var(--badbg);color:var(--bad)}
  .tag.ok{background:var(--okbg);color:var(--green)}
  .wrongs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .wrongs span{font-family:'Space Mono',monospace;font-weight:700;font-size:16px;
    border:2px solid var(--bad);color:var(--bad);border-radius:10px;padding:7px 13px}
  .row3{display:flex;gap:8px;margin-top:8px}
  .row3 > div{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13.5px}
  .row3 .k{font-size:11.5px;color:var(--muted);font-weight:800;display:block}
  .why{font-size:13.5px;color:#2c4a45;margin-top:8px;padding-left:10px;border-left:3px solid var(--line)}
  .score{text-align:center;padding:10px 0}
  .score b{display:block;font-family:'Space Mono',monospace;font-size:46px;color:var(--green);line-height:1.2}
  .self{display:flex;gap:7px;margin-top:8px}
  .self button{flex:1;font-family:inherit;font-size:14px;font-weight:800;border:2px solid var(--line);
    background:#fff;color:var(--muted);border-radius:10px;padding:11px;cursor:pointer}
  .self button.on{border-color:var(--green);background:var(--green);color:#fff}
  .hide{display:none !important}
  .exam{display:block;width:100%;text-align:left;font-family:inherit;font-size:16px;font-weight:700;
    border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer}
  .exam span{display:block;font-size:13px;color:var(--muted);font-weight:500}
</style>
</head>
<body>
<div class="wrap">

<!-- ① 로그인 -->
<div class="card" id="s-login">
  <h1>✅ 시험지 채점</h1>
  <p class="lead">종이로 푼 답을 넣으면 바로 채점해 줍니다.</p>
  <label>학생번호</label>
  <input id="sid" inputmode="text" autocomplete="username" placeholder="예: s001">
  <label>출결번호 (네 자리)</label>
  <input id="pin" inputmode="numeric" autocomplete="current-password" type="password" placeholder="••••">
  <div style="margin-top:14px"><button class="btn" id="go">들어가기</button></div>
  <div id="loginMsg"></div>
</div>

<!-- ② 시험지 고르기 -->
<div class="card hide" id="s-list">
  <h2>어느 시험지인가요?</h2>
  <p class="lead" id="hello"></p>
  <div id="exams"></div>
</div>

<!-- ③ 풀기 -->
<div class="card hide" id="s-solve">
  <h2 id="solveTitle"></h2>
  <p class="lead" id="solveLead">번호마다 고른 답을 눌러주세요.</p>
  <div id="qs"></div>
  <div style="margin-top:16px"><button class="btn" id="submit">제출</button></div>
  <div id="solveMsg"></div>
</div>

<!-- ④ 틀린 번호 -->
<div class="card hide" id="s-wrong">
  <h2>틀린 번호예요</h2>
  <p class="lead">정답은 아직 안 알려줄게요. <b>한 번 더</b> 풀어보세요.</p>
  <div class="wrongs" id="wrongList"></div>
  <div style="margin-top:8px"><button class="btn" id="toRetry">틀린 문제 다시 풀기</button></div>
</div>

<!-- ⑤ 정답·해설 -->
<div class="card hide" id="s-answer">
  <h2>정답과 해설</h2>
  <p class="lead">처음 답 → 다시 푼 답 → 정답 순서로 보여줄게요.</p>
  <div id="ansList"></div>
</div>

<!-- ⑥ 서술형 자기채점 -->
<div class="card hide" id="s-self">
  <h2>서술형은 스스로 매겨요</h2>
  <p class="lead">모범답안을 보고 <b>솔직하게</b> 골라주세요.</p>
  <div id="selfList"></div>
  <div style="margin-top:14px"><button class="btn" id="selfGo">점수 보기</button></div>
  <div id="selfMsg"></div>
</div>

<!-- ⑦ 점수 -->
<div class="card hide" id="s-score">
  <h2>오늘 점수</h2>
  <div class="score"><b id="scoreNum">—</b><span id="scoreSub" class="lead"></span></div>
  <div id="fixedNote"></div>
  <div style="margin-top:10px"><button class="btn ghost sm" id="restart">처음부터 다시 풀기</button></div>
  <p class="lead" style="margin-top:10px;font-size:13px">
    「처음부터 다시」를 해도 <b>지금 기록은 지워지지 않아요.</b> 선생님은 둘 다 보십니다.
  </p>
</div>

</div>
<script>
const $ = (i) => document.getElementById(i);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const 보이기 = (id, 켜나) => $(id).classList.toggle("hide", !켜나);
const 알림 = (el, 글, 나쁜가) => { el.innerHTML = 글 ? `<div class="msg ${나쁜가?"bad":"ok"}">${글}</div>` : ""; };

// 로그인 정보는 **이 기기에만** 둡니다. 서버에 토큰을 안 만든 이유 —
// 학생이 쓰는 건 짧고, 틀리면 다시 넣으면 됩니다. 단순한 쪽을 골랐습니다.
let 나 = { studentId: "", pin: "" };
let 시험 = null, tryId = null, 공개 = null;
const 내답 = {};      // 처음 낸 답
const 다시답 = {};    // 다시 푼 답
const 자기채점 = {};  // 서술형

async function 부르기(action, more = {}) {
  const r = await fetch("/api/exam", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ action, ...나, ...more }),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "실패");
  return d;
}

// ── 로그인 ──
$("go").onclick = async () => {
  나 = { studentId: $("sid").value.trim(), pin: $("pin").value.trim() };
  if (!나.studentId || !나.pin) return 알림($("loginMsg"), "학생번호와 출결번호를 넣어주세요.", true);
  $("go").disabled = true;
  try {
    const d = await 부르기("login");
    $("hello").textContent = `${d.student.name || d.student.student_id} 님, 안녕하세요!`;
    $("exams").innerHTML = d.exams.length
      ? d.exams.map((e) => `<button class="exam" data-id="${e.id}">${esc(e.title)}<span>${e.total}문항</span></button>`).join("")
      : `<p class="lead">아직 올라온 시험지가 없어요. 선생님께 물어보세요.</p>`;
    for (const b of $("exams").querySelectorAll(".exam")) b.onclick = () => 열기(b.dataset.id);
    보이기("s-login", false); 보이기("s-list", true);
    알림($("loginMsg"), "", false);
  } catch (e) { 알림($("loginMsg"), esc(e.message), true); }
  $("go").disabled = false;
};
$("pin").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });

// ── 풀기 ──
async function 열기(id) {
  try {
    const d = await 부르기("open", { examId: id });
    시험 = d.exam;
    for (const k of Object.keys(내답)) delete 내답[k];
    $("solveTitle").textContent = 시험.title;
    $("solveLead").textContent = `${시험.total}문항 · 종이에 푼 답을 눌러주세요. 서술형은 비워도 돼요.`;
    $("qs").innerHTML = 시험.items.map(문항그리기).join("");
    붙이기("qs", 내답);
    보이기("s-list", false); 보이기("s-solve", true);
    window.scrollTo(0, 0);
  } catch (e) { 알림($("loginMsg"), esc(e.message), true); }
}

function 문항그리기(it, _i, _a, 다시 = false) {
  if (it.kind === "essay") {
    return `<div class="q" data-no="${it.no}">
      <div class="no"><b>${it.no}</b> <span class="tag">서술형</span></div>
      <textarea rows="3" data-essay="${it.no}" placeholder="적어도 되고, 비워도 돼요"></textarea></div>`;
  }
  const 칸 = [1,2,3,4,5].map((n) =>
    `<button type="button" data-no="${it.no}" data-v="${n}">${"①②③④⑤"[n-1]}</button>`).join("");
  return `<div class="q${다시?" again":""}" data-no="${it.no}">
    <div class="no"><b>${it.no}</b>${다시표(다시)}</div>
    <div class="pick">${칸}</div></div>`;
}
const 다시표 = (다시) => (다시 ? ' <span class="tag bad">다시</span>' : "");

// 복수 정답도 고를 수 있게 — 누르면 켜지고 다시 누르면 꺼집니다
function 붙이기(root, 담을곳) {
  for (const b of $(root).querySelectorAll(".pick button")) {
    b.onclick = () => {
      const no = b.dataset.no, v = Number(b.dataset.v);
      const 지금 = new Set(담을곳[no] ?? []);
      지금.has(v) ? 지금.delete(v) : 지금.add(v);
      담을곳[no] = [...지금].sort((x, y) => x - y);
      if (!담을곳[no].length) delete 담을곳[no];
      for (const x of $(root).querySelectorAll(`.pick button[data-no="${no}"]`))
        x.classList.toggle("on", (담을곳[no] ?? []).includes(Number(x.dataset.v)));
    };
  }
  for (const t of $(root).querySelectorAll("textarea[data-essay]")) {
    t.oninput = () => { 담을곳[t.dataset.essay] = t.value; };
  }
}

$("submit").onclick = async () => {
  const 안푼것 = 시험.items.filter((it) => it.kind === "choice" && !(내답[String(it.no)]?.length));
  if (안푼것.length && !confirm(`${안푼것.length}문항을 안 고르셨어요. 그대로 낼까요?`)) return;
  $("submit").disabled = true;
  try {
    const d = await 부르기("submit", { examId: 시험.id, answers: 내답 });
    tryId = d.tryId;
    보이기("s-solve", false);
    if (!d.wrong.length) {
      // 다 맞았으면 다시 풀 게 없습니다 — 바로 정답·해설로
      await 다시내기({});
    } else {
      $("wrongList").innerHTML = d.wrong.map((n) => `<span>${n}</span>`).join("");
      보이기("s-wrong", true);
      window.scrollTo(0, 0);
    }
  } catch (e) { 알림($("solveMsg"), esc(e.message), true); }
  $("submit").disabled = false;
};

// ── 틀린 것만 다시 (한 번) ──
$("toRetry").onclick = () => {
  const 틀린 = [...$("wrongList").querySelectorAll("span")].map((s) => Number(s.textContent));
  const 것들 = 시험.items.filter((it) => 틀린.includes(it.no));
  $("solveTitle").textContent = "틀린 문제 다시";
  $("solveLead").textContent = "이번이 마지막이에요. 천천히 생각해 보세요.";
  $("qs").innerHTML = 것들.map((it) => 문항그리기(it, 0, 0, true)).join("");
  붙이기("qs", 다시답);
  $("submit").textContent = "다시 제출";
  $("submit").onclick = async () => { $("submit").disabled = true; await 다시내기(다시답); $("submit").disabled = false; };
  보이기("s-wrong", false); 보이기("s-solve", true);
  window.scrollTo(0, 0);
};

async function 다시내기(답) {
  try {
    const d = await 부르기("retry", { tryId, answers: 답 });
    공개 = d;
    보이기("s-solve", false);
    그리기정답(d);
  } catch (e) { 알림($("solveMsg"), esc(e.message), true); }
}

// ── 정답·해설 ──
const 동글 = (v) => {
  const a = Array.isArray(v) ? v : (v == null || v === "" ? [] : [v]);
  return a.map((n) => "①②③④⑤"[Number(n) - 1] ?? String(n)).join(" ") || "—";
};

function 그리기정답(d) {
  const 객 = d.items.filter((it) => it.kind !== "essay");
  $("ansList").innerHTML = 객.map((it) => {
    const 맞음 = !it.wasWrong;
    const 고침 = d.fixed.includes(it.no);
    return `<div class="q">
      <div class="no"><b>${it.no}</b>
        ${맞음 ? '<span class="tag ok">맞음</span>'
               : 고침 ? '<span class="tag ok">다시 풀어 맞힘</span>'
                      : '<span class="tag bad">틀림</span>'}</div>
      <div class="row3">
        <div><span class="k">처음 답</span>${동글(it.mine)}</div>
        ${it.wasWrong ? `<div><span class="k">다시 푼 답</span>${동글(it.again)}</div>` : ""}
        <div><span class="k">정답</span><b>${동글(it.answers)}</b></div>
      </div>
      ${it.why ? `<div class="why">${esc(it.why)}</div>` : ""}
    </div>`;
  }).join("");
  보이기("s-answer", true);

  // 서술형이 있으면 자기채점으로
  const 서술 = d.items.filter((it) => it.kind === "essay");
  if (서술.length) {
    $("selfList").innerHTML = 서술.map((it) => `<div class="q" data-no="${it.no}">
      <div class="no"><b>${it.no}</b> <span class="tag">서술형 · ${it.point}점</span></div>
      <div class="row3"><div><span class="k">내가 쓴 것</span>${esc(it.mine || "안 씀")}</div></div>
      <div class="why"><b>모범답안</b><br>${esc(it.model || "(없음)")}</div>
      <div class="self">
        <button data-no="${it.no}" data-v="ok">맞음</button>
        <button data-no="${it.no}" data-v="part">부분</button>
        <button data-no="${it.no}" data-v="no">틀림</button>
      </div></div>`).join("");
    for (const b of $("selfList").querySelectorAll(".self button")) {
      b.onclick = () => {
        자기채점[b.dataset.no] = b.dataset.v;
        for (const x of $("selfList").querySelectorAll(`.self button[data-no="${b.dataset.no}"]`))
          x.classList.toggle("on", x === b);
      };
    }
    보이기("s-self", true);
  } else {
    매기기({});
  }
  window.scrollTo(0, 0);
}

$("selfGo").onclick = async () => {
  const 서술 = (공개?.items ?? []).filter((it) => it.kind === "essay");
  const 안고른 = 서술.filter((it) => !자기채점[String(it.no)]);
  if (안고른.length) return 알림($("selfMsg"), `${안고른.length}개를 아직 안 고르셨어요.`, true);
  $("selfGo").disabled = true;
  await 매기기(자기채점);
  $("selfGo").disabled = false;
};

async function 매기기(self) {
  try {
    const d = await 부르기("self", { tryId, self });
    $("scoreNum").textContent = `${d.score} / ${d.max}`;
    $("scoreSub").textContent = "처음 낸 답으로 매긴 점수예요.";
    const 고침 = 공개?.fixed ?? [];
    $("fixedNote").innerHTML = 고침.length
      ? `<div class="msg ok">다시 풀어서 맞힌 번호: <b>${고침.join(", ")}</b><br>
         점수에는 안 들어가지만, <b>이제는 아는 문제</b>예요.</div>`
      : "";
    보이기("s-self", false);
    보이기("s-score", true);
    window.scrollTo(0, 0);
  } catch (e) { 알림($("selfMsg"), esc(e.message), true); }
}

$("restart").onclick = () => location.reload();
</script>
</body>
</html>
